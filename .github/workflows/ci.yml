name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: kith
          POSTGRES_PASSWORD: kith
          POSTGRES_DB: kith
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://kith:kith@localhost:5432/kith
      # Kith's own role, which sees only schema kith, as in production.
      DATABASE_URL: postgres://kith_app:kith_app@localhost:5432/kith
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Create Kith's schema and role with the SQL in docs/operations.md
        run: |
          sed -n '/^```sql$/,/^```$/{//!p;}' docs/operations.md \
            | sed 's/<password>/kith_app/' \
            | psql -v ON_ERROR_STOP=1 "$TEST_DATABASE_URL"
      # While the database is still empty: the end-to-end tests migrate it too.
      - name: Migrate an empty database
        run: node packages/server/dist/migrate-main.js
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t kith-server .
      - name: Serve /healthz, the welcome page and the client from the image
        run: |
          docker run -d --name kith-server -p 3000:3000 \
            -e DATABASE_URL=postgres://kith:kith@127.0.0.1:5432/kith \
            -e LLM_API_KEY=ci-placeholder \
            -e APP_ORIGIN=http://localhost:3000 \
            -e SESSION_SECRET=ci-placeholder-session-secret-0123456789 \
            -e GOOGLE_CLIENT_ID=ci-placeholder \
            -e GOOGLE_CLIENT_SECRET=ci-placeholder \
            kith-server
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz; then
              curl -fsS http://localhost:3000/ | grep -q 'Sign in with Google' \
                && curl -fsS http://localhost:3000/next/ | grep -q 'src="/next/assets/' \
                && exit 0
              break
            fi
            sleep 1
          done
          docker logs kith-server
          exit 1
